name: "Lab 6 - Model Registry and Lifecycle"

on:
  workflow_dispatch:

jobs:
  model-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare processed data using Lab 5
        run: python pipelines/run_lab5_pipeline.py

      - name: Run the Lab 6 registry and lifecycle pipeline
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: python pipelines/run_lab6_registry.py

      - name: Upload Lab 6 registry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab6-registry-${{ github.run_number }}
          path: |
            artifacts/**
            reports/**
            mlruns/**
          if-no-files-found: ignore
