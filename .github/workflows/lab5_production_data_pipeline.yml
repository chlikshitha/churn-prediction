name: "Lab 5 - Production Data Pipeline"

on:
  workflow_dispatch:

jobs:
  production-data-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the Lab 5 validation and preprocessing pipeline
        run: python pipelines/run_lab5_pipeline.py

      - name: Upload Lab 5 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab5-data-pipeline-${{ github.run_number }}
          path: |
            artifacts/**
            data/processed/**
            models/**
          if-no-files-found: ignore
